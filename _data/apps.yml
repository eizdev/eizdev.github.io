# One entry per app; the key is the URL slug (/<slug>/privacy/ ...).
# The policy/terms/support templates in _includes/docs/ switch paragraphs on
# these flags, so keep them true to what the shipped app actually does.
# New app: add an entry here, then `ruby scripts/new_app.rb <slug>`.
#
# Optional flags (absent = off), used by apps with a server or user content.
# See the `stickerzzz` entry for examples:
#   server: { host, data }      what our server stores (needs accounts: true)
#   server_delete               how to get the server data deleted
#   telegram, telegram_bot,     Telegram linking via a bot and publishing to Telegram
#   telegram_disconnect_path
#   user_content                Terms: rules for photos/content the user uploads
#   ads_consent: false          the app shows no consent message (no UMP)
#   ads_privacy_path            in-app path to change the ad consent (UMP privacy options)
#   ad_formats                  which ads the free version shows
#   ads_paid_note               sentence on what purchases do to ads (default: premium_name removes ads)
#   iap_plans                   several one-time purchases instead of one premium_name
#   iap_server_check            purchases are verified by our server with the store
#   data_location               support FAQ answer to "Where is my data stored?"
#   warranty_note               app-specific sentence in Terms → No warranty
#   analytics_note              Privacy → Analytics: provider, data, purpose, retention (needs analytics: true)
#   iap_note                    extra sentence after Privacy → Purchases and Terms → Purchases (e.g. consumables)
#   restore_note                support FAQ answer to "I bought … but it isn't unlocked" instead of the default
#   ads_note                    extra paragraph after Privacy → Advertising (e.g. platform differences)
#   delete_data_note            support FAQ sentence after delete_data_path instead of "Uninstalling … deletes everything"

stick-and-kick:
  name: Stick & Kick
  tagline:
    en: Drum timing trainer — tap along, see how steady you are.
    uk: Тренажер ритму для барабанщиків — грайте під клік і бачте свою точність.
    de: Timing-Trainer für Drummer — mitklopfen und sehen, wie stabil du bist.
    fr: "Entraîneur de rythme pour batteurs — tapez en mesure et voyez votre régularité."
    es: "Entrenador de ritmo para bateristas: toca al compás y mira lo estable que eres."
  email_tag: stickkick               # plus-alias tag, used only if studio.support.plus_aliases
  effective_date: 2026-10-17
  stores:
    ios: ""                          # App Store URL once live
    android: ""                      # https://play.google.com/store/apps/details?id=com.stickandkick.app

  ads: true                          # Google AdMob in the free version (UMP consent in EEA/UK/CH)
  iap: true                          # in-app purchase
  iap_kind: one_time                 # one_time | subscription
  premium_name: Premium
  accounts: false                    # user accounts / own servers
  analytics: false                   # analytics or crash reporting

  # In-app path to the "delete all my data" action, or "" if there is none.
  # fr/es show the English labels; switch them if the app ships French or Spanish.
  delete_data_path:
    en: Settings → Legal & privacy → Delete all my data
    uk: Налаштування → Правова інформація → Видалити всі мої дані
    de: Einstellungen → Rechtliches & Datenschutz → Alle meine Daten löschen
    fr: "Settings → Legal & privacy → Delete all my data"
    es: "Settings → Legal & privacy → Delete all my data"

  # Third-party SDKs that process personal data.
  sdks:
    - name: Google AdMob
      provider: Google Ireland Limited (EEA/UK/CH), Google LLC (elsewhere)
      purpose: { en: Advertising, uk: Реклама, de: Werbung, fr: "Publicité", es: "Publicidad" }
      privacy_url: https://policies.google.com/privacy
    - name: Google User Messaging Platform
      provider: Google Ireland Limited / Google LLC
      purpose: { en: Ad consent, uk: Згода на рекламу, de: Werbe-Einwilligung, fr: "Consentement publicitaire", es: "Consentimiento para anuncios" }
      privacy_url: https://policies.google.com/privacy

  # Data the app stores locally (never sent to us).
  local_data:
    - en: Patterns you record (name, tempo, meter, beats)
      uk: Записані вами патерни (назва, темп, розмір, удари)
      de: Von dir aufgenommene Patterns (Name, Tempo, Takt, Schläge)
      fr: "Les patterns que vous enregistrez (nom, tempo, mesure, frappes)"
      es: "Los patrones que grabas (nombre, tempo, compás, golpes)"
    - en: Practice history and timing scores
      uk: Історія занять і оцінки точності
      de: Übungsverlauf und Timing-Werte
      fr: "Historique d’entraînement et scores de précision"
      es: "Historial de práctica y puntuaciones de ritmo"
    - en: Calibration offset (audio/touch delay)
      uk: Калібрування (затримка звуку/дотику)
      de: Kalibrierung (Audio-/Touch-Verzögerung)
      fr: "Calibrage (latence audio/tactile)"
      es: "Calibración (retardo de audio/toque)"
    - en: Settings and whether Premium is unlocked
      uk: Налаштування та чи розблоковано Premium
      de: Einstellungen und ob Premium freigeschaltet ist
      fr: "Réglages et déblocage éventuel de Premium"
      es: "Ajustes y si Premium está desbloqueado"

  # App-specific FAQ for the support page (generic purchase/data/ads answers
  # are added automatically from the flags above).
  faq:
    - q:
        en: My results feel off with Bluetooth headphones.
        uk: З Bluetooth-навушниками результати здаються неточними.
        de: Mit Bluetooth-Kopfhörern wirken die Ergebnisse ungenau.
        fr: "Mes résultats semblent faux avec un casque Bluetooth."
        es: "Con auriculares Bluetooth los resultados no parecen precisos."
      a:
        en: Bluetooth adds a variable delay. Use wired headphones or the speaker, or run Settings → Calibration with the headphones connected.
        uk: Bluetooth додає змінну затримку. Використовуйте дротові навушники чи динамік або пройдіть Налаштування → Калібрування з підключеними навушниками.
        de: Bluetooth fügt eine schwankende Verzögerung hinzu. Nutze kabelgebundene Kopfhörer oder den Lautsprecher oder führe Einstellungen → Kalibrierung mit verbundenen Kopfhörern aus.
        fr: "Le Bluetooth ajoute une latence variable. Utilisez un casque filaire ou le haut-parleur, ou lancez Settings → Calibration avec le casque connecté."
        es: "El Bluetooth añade un retardo variable. Usa auriculares con cable o el altavoz, o ejecuta Settings → Calibration con los auriculares conectados."

stickerzzz:
  name: Stickerzzz
  tagline:
    en: Turn your photos into Telegram sticker packs.
    uk: Перетворюйте свої фото на набори стікерів для Telegram.
    de: Mach aus deinen Fotos Sticker-Packs für Telegram.
    fr: "Transformez vos photos en packs de stickers Telegram."
    es: "Convierte tus fotos en packs de stickers para Telegram."
  email_tag: stickerzzz              # plus-alias tag, used only if studio.support.plus_aliases
  effective_date: 2026-10-18
  stores:
    ios: ""                          # Android only
    android: https://play.google.com/store/apps/details?id=com.eizdev.stickerzzz

  # Free version: interstitial ads at some moments + optional rewarded videos
  # (lib/models/services/ads_manager_service.dart, lib/core/ads/rewarded_video.dart).
  # No banner. EU consent through Google's UMP (lib/core/ads/ad_consent.dart):
  # nothing is requested before it; Settings → Ad privacy choices changes it.
  ads: true
  ads_privacy_path:
    en: Settings → Ad privacy choices
    uk: Налаштування → Конфіденційність реклами
    de: Settings → Ad privacy choices
    fr: "Réglages → Confidentialité des annonces"
    es: "Ajustes → Privacidad de los anuncios"
  ad_formats:
    en: full-screen ads at some moments, and rewarded videos you can choose to watch for 5 more stickers in a pack
    uk: повноекранну рекламу в окремі моменти та відео з винагородою, які ви можете переглянути, щоб отримати ще 5 стікерів у паку
    de: Vollbildanzeigen an manchen Stellen und Videos mit Belohnung, die du freiwillig für 5 weitere Sticker in einem Pack ansehen kannst
    fr: "des publicités plein écran à certains moments, et des vidéos avec récompense que vous pouvez choisir de regarder pour 5 stickers de plus dans un pack"
    es: "anuncios a pantalla completa en algunos momentos y vídeos con recompensa que puedes elegir ver para tener 5 stickers más en un pack"
  # Plus keeps ads; Ads Free/Premium turn off interstitials (LimitsService.showsAds).
  # The optional rewarded video (+5 stickers) stays available to everyone who still needs it.
  ads_paid_note:
    en: Ads Free and Premium turn off the full-screen ads; rewarded videos only play when you choose to watch one.
    uk: Ads Free і Premium вимикають повноекранну рекламу; відео з винагородою відтворюються лише тоді, коли ви самі вирішите його переглянути.
    de: Ads Free und Premium schalten die Vollbildanzeigen ab; Belohnungsvideos laufen nur, wenn du selbst eins ansehen möchtest.
    fr: "Ads Free et Premium désactivent les publicités plein écran ; les vidéos avec récompense ne se lancent que si vous choisissez d’en regarder une."
    es: "Ads Free y Premium desactivan los anuncios a pantalla completa; los vídeos con recompensa solo se reproducen cuando eliges ver uno."

  # Google Play Billing one-time products ads_free / unlimited (shown as "Plus") / premium,
  # verified by our server (api-worker POST /v1/purchases → Google Play Developer API).
  iap: true
  iap_kind: one_time
  premium_name: Premium
  iap_plans:
    en: Ads Free, Plus and Premium
    uk: Ads Free, Plus і Premium
    de: Ads Free, Plus und Premium
    fr: "Ads Free, Plus et Premium"
    es: "Ads Free, Plus y Premium"
  iap_server_check: true
  # Fair use (round 2, D-B4/D-B5): the cap every account has, paid plans included.
  fair_use:
    en: An account can have up to 100 sticker packs.
    uk: В одному обліковому записі може бути до 100 наборів стікерів.
    de: Ein Konto kann bis zu 100 Sticker-Packs haben.
    fr: "Un compte peut avoir jusqu’à 100 packs de stickers."
    es: "Una cuenta puede tener hasta 100 packs de stickers."

  # Firebase Anonymous Auth + own server (Cloudflare Worker + D1). No sign-in with
  # name/email. Firebase Crashlytics for crashes and errors (lib/core/logging/app_log.dart);
  # no Firebase Analytics.
  accounts: true
  analytics: true
  analytics_note:
    en: "The app uses Firebase Crashlytics (Google LLC) to find and fix crashes and errors. When the app crashes or hits an unexpected error, it sends a report with the error and where in the code it happened, the last log lines before it (screens opened, requests to our server and their results, with technical IDs — never your photos, stickers, tokens or purchase tokens), your device model and system version, the app version, a Crashlytics installation ID and your anonymous app ID, plus the app language and theme, whether Telegram is connected, how many packs you published and whether you own a plan. We use these reports only to keep the app working (our legitimate interest in a stable app); Crashlytics keeps them for 90 days. There is no analytics: we do not track how you use the app."
    uk: "Застосунок використовує Firebase Crashlytics (Google LLC), щоб знаходити й виправляти збої та помилки. Коли застосунок аварійно завершується або натрапляє на неочікувану помилку, він надсилає звіт з помилкою та місцем у коді, де вона сталася, останніми рядками журналу перед нею (відкриті екрани, запити до нашого сервера та їхні результати з технічними ідентифікаторами — ніколи не ваші фото, стікери, токени чи токени покупок), моделлю пристрою та версією системи, версією застосунку, ідентифікатором встановлення Crashlytics і вашим анонімним ідентифікатором застосунку, а також мовою й темою застосунку, тим, чи підключено Telegram, кількістю опублікованих паків і тим, чи є у вас тариф. Ми використовуємо ці звіти лише для того, щоб застосунок працював (наш законний інтерес у стабільному застосунку); Crashlytics зберігає їх 90 днів. Аналітики немає: ми не відстежуємо, як ви користуєтеся застосунком."
    de: "Die App nutzt Firebase Crashlytics (Google LLC), um Abstürze und Fehler zu finden und zu beheben. Stürzt die App ab oder tritt ein unerwarteter Fehler auf, sendet sie einen Bericht mit dem Fehler und der Stelle im Code, den letzten Protokollzeilen davor (geöffnete Bildschirme, Anfragen an unseren Server und ihre Ergebnisse, mit technischen IDs — nie deine Fotos, Sticker, Tokens oder Kauf-Tokens), deinem Gerätemodell und der Systemversion, der App-Version, einer Crashlytics-Installations-ID und deiner anonymen App-ID sowie der App-Sprache und dem Design, ob Telegram verbunden ist, wie viele Packs du veröffentlicht hast und ob du einen Plan besitzt. Wir nutzen diese Berichte nur, damit die App funktioniert (unser berechtigtes Interesse an einer stabilen App); Crashlytics speichert sie 90 Tage. Es gibt keine Analyse: Wir verfolgen nicht, wie du die App nutzt."
    fr: "L’app utilise Firebase Crashlytics (Google LLC) pour détecter et corriger les plantages et les erreurs. Lorsque l’app plante ou rencontre une erreur inattendue, elle envoie un rapport contenant l’erreur et l’endroit du code où elle s’est produite, les dernières lignes du journal qui la précèdent (écrans ouverts, requêtes à notre serveur et leurs résultats, avec des identifiants techniques — jamais vos photos, vos stickers, vos jetons ni vos jetons d’achat), le modèle de votre appareil et la version du système, la version de l’app, un identifiant d’installation Crashlytics et votre identifiant d’app anonyme, ainsi que la langue et le thème de l’app, la connexion ou non de Telegram, le nombre de packs publiés et la possession éventuelle d’une offre. Nous utilisons ces rapports uniquement pour que l’app fonctionne (notre intérêt légitime à disposer d’une app stable) ; Crashlytics les conserve 90 jours. Il n’y a aucune analyse d’usage : nous ne suivons pas la façon dont vous utilisez l’app."
    es: "La app usa Firebase Crashlytics (Google LLC) para encontrar y corregir fallos y errores. Cuando la app se cierra inesperadamente o encuentra un error inesperado, envía un informe con el error y el punto del código donde ocurrió, las últimas líneas del registro anteriores (pantallas abiertas, solicitudes a nuestro servidor y sus resultados, con identificadores técnicos; nunca tus fotos, stickers, tokens ni tokens de compra), el modelo de tu dispositivo y la versión del sistema, la versión de la app, un identificador de instalación de Crashlytics y tu identificador de app anónimo, además del idioma y el tema de la app, si Telegram está conectado, cuántos packs has publicado y si tienes algún plan. Usamos estos informes solo para que la app funcione (nuestro interés legítimo en una app estable); Crashlytics los conserva 90 días. No hay analítica: no seguimos cómo usas la app."
  server:
    host: Cloudflare, Inc. (Cloudflare Workers, D1)
    data:
      - en: A random app ID from Firebase Anonymous Authentication, and when it was first seen
        uk: Випадковий ідентифікатор застосунку з Firebase Anonymous Authentication і час його першої появи
        de: Eine zufällige App-ID aus Firebase Anonymous Authentication und wann sie zuerst gesehen wurde
        fr: "Un identifiant d’app aléatoire issu de Firebase Anonymous Authentication, et la date à laquelle il a été vu pour la première fois"
        es: "Un identificador de app aleatorio de Firebase Anonymous Authentication y cuándo se vio por primera vez"
      - en: Which plans you own (Ads Free, Plus, Premium). The purchase token the app sends is used to check the purchase with Google Play; we keep only a one-way hash of it, to limit how many accounts one purchase unlocks
        uk: Які тарифи у вас є (Ads Free, Plus, Premium). Токен покупки, який надсилає застосунок, використовується для перевірки в Google Play; ми зберігаємо лише його односторонній хеш, щоб обмежити кількість облікових записів для однієї покупки
        de: Welche Pläne du besitzt (Ads Free, Plus, Premium). Das Kauf-Token, das die App sendet, wird zur Prüfung bei Google Play verwendet; wir speichern nur einen Einweg-Hash davon, um zu begrenzen, wie viele Konten ein Kauf freischaltet
        fr: "Les offres que vous possédez (Ads Free, Plus, Premium). Le jeton d’achat envoyé par l’app sert à vérifier l’achat auprès de Google Play ; nous n’en gardons qu’une empreinte irréversible, pour limiter le nombre de comptes qu’un achat débloque"
        es: "Qué planes tienes (Ads Free, Plus, Premium). El token de compra que envía la app se usa para comprobar la compra con Google Play; solo guardamos un hash irreversible de él, para limitar cuántas cuentas desbloquea una compra"
      - en: "If you connect Telegram: your Telegram user ID, username and first name, and the one-time connect code"
        uk: "Якщо ви підключили Telegram: ваш ідентифікатор користувача Telegram, ім’я користувача (username) та ім’я, а також одноразовий код підключення"
        de: "Wenn du Telegram verbindest: deine Telegram-Nutzer-ID, deinen Benutzernamen und Vornamen sowie den einmaligen Verbindungscode"
        fr: "Si vous connectez Telegram : votre identifiant d’utilisateur Telegram, votre nom d’utilisateur et votre prénom, ainsi que le code de connexion à usage unique"
        es: "Si conectas Telegram: tu ID de usuario de Telegram, tu nombre de usuario y tu nombre, y el código de conexión de un solo uso"
      - en: "For each pack you published: its title, link name, creation time and a list of its stickers' Telegram IDs (the stickers themselves are stored by Telegram)"
        uk: "Для кожного опублікованого паку: назва, назва посилання, час створення і перелік ідентифікаторів його стікерів у Telegram (самі стікери зберігає Telegram)"
        de: "Für jedes veröffentlichte Pack: Titel, Link-Name, Erstellungszeit und eine Liste der Telegram-IDs seiner Sticker (die Sticker selbst speichert Telegram)"
        fr: "Pour chaque pack publié : son titre, son nom de lien, sa date de création et la liste des identifiants Telegram de ses stickers (les stickers eux-mêmes sont stockés par Telegram)"
        es: "Para cada pack publicado: su título, el nombre del enlace, la fecha de creación y una lista de los ID de Telegram de sus stickers (los stickers en sí los guarda Telegram)"
      - en: "Rewarded videos: when you finish one, Google AdMob tells our server so, with your anonymous app ID and a pack ID (no personal data). We keep each reward (time, pack ID, AdMob's transaction ID) to add the stickers and to count 5 videos per 24 hours"
        uk: "Відео з винагородою: коли ви додивилися відео, Google AdMob повідомляє про це наш сервер, передаючи ваш анонімний ідентифікатор застосунку та ідентифікатор паку (без персональних даних). Ми зберігаємо кожну винагороду (час, ідентифікатор паку, ідентифікатор транзакції AdMob), щоб додати стікери й рахувати 5 відео за 24 години"
        de: "Belohnungsvideos: Wenn du eins zu Ende ansiehst, teilt Google AdMob das unserem Server mit, mit deiner anonymen App-ID und einer Pack-ID (keine personenbezogenen Daten). Wir speichern jede Belohnung (Zeit, Pack-ID, Transaktions-ID von AdMob), um die Sticker hinzuzufügen und 5 Videos pro 24 Stunden zu zählen"
        fr: "Vidéos avec récompense : quand vous en terminez une, Google AdMob le signale à notre serveur, avec votre identifiant d’app anonyme et un identifiant de pack (aucune donnée personnelle). Nous conservons chaque récompense (heure, identifiant du pack, identifiant de transaction AdMob) pour ajouter les stickers et compter 5 vidéos par 24 heures"
        es: "Vídeos con recompensa: cuando terminas uno, Google AdMob se lo comunica a nuestro servidor, con tu identificador de app anónimo y un identificador de pack (sin datos personales). Guardamos cada recompensa (hora, identificador del pack, identificador de transacción de AdMob) para añadir los stickers y contar 5 vídeos cada 24 horas"
  server_delete:
    en: Clear app data (see above) disconnects Telegram and starts a new anonymous ID on this phone, but the old record stays on our server. To have it deleted, email us and tell us your Telegram username if you connected one. We delete the record within 30 days. Packs you published stay on Telegram until you delete them in the app (do it before clearing app data), or ask us in the same email to delete them.
    uk: «Очистити дані застосунку» (див. вище) відключає Telegram і створює новий анонімний ідентифікатор на цьому телефоні, але старий запис залишається на нашому сервері. Щоб його видалити, напишіть нам і вкажіть ваш username у Telegram, якщо ви його підключали. Ми видалимо запис протягом 30 днів. Опубліковані паки залишаються в Telegram, доки ви не видалите їх у застосунку (зробіть це до очищення даних) або не попросите нас видалити їх у тому самому листі.
    de: „App-Daten löschen“ (siehe oben) trennt Telegram und erzeugt auf diesem Telefon eine neue anonyme ID, der alte Eintrag bleibt aber auf unserem Server. Um ihn löschen zu lassen, schreib uns eine E-Mail und nenne deinen Telegram-Benutzernamen, falls du Telegram verbunden hast. Wir löschen den Eintrag innerhalb von 30 Tagen. Veröffentlichte Packs bleiben auf Telegram, bis du sie in der App löschst (vor dem Löschen der App-Daten) oder uns in derselben E-Mail bittest, sie zu löschen.
    fr: "« Effacer les données » (voir ci-dessus) déconnecte Telegram et crée un nouvel identifiant anonyme sur ce téléphone, mais l’ancien enregistrement reste sur notre serveur. Pour le faire supprimer, écrivez-nous en indiquant votre nom d’utilisateur Telegram si vous en avez connecté un. Nous supprimons l’enregistrement sous 30 jours. Les packs publiés restent sur Telegram jusqu’à ce que vous les supprimiez dans l’app (faites-le avant d’effacer les données) ou que vous nous demandiez de les supprimer dans le même e-mail."
    es: "«Borrar datos» (ver arriba) desconecta Telegram y crea un nuevo identificador anónimo en este teléfono, pero el registro antiguo se queda en nuestro servidor. Para que lo borremos, escríbenos e indica tu nombre de usuario de Telegram si conectaste uno. Borramos el registro en un plazo de 30 días. Los packs que publicaste se quedan en Telegram hasta que los borres en la app (hazlo antes de borrar los datos) o nos pidas en el mismo correo que los borremos."

  # Telegram linking via the bot; packs are published under the user's account.
  telegram: true
  telegram_bot: StickerzzzApp_bot
  telegram_disconnect_path:
    en: Settings → Telegram → Disconnect
    uk: Налаштування → Telegram → Відключити
    de: Settings → Telegram → Disconnect
    fr: "Réglages → Telegram → Déconnecter"
    es: "Ajustes → Telegram → Desconectar"

  user_content: true

  # "Settings → Clear app data" (lib/ui/screens/settings/clear_app_data_dialog.dart,
  # lib/core/app_data_service.dart). The app has no German UI, so de shows the English labels;
  # fr/es use the app's French and Spanish labels.
  delete_data_path:
    en: Settings → Clear app data
    uk: Налаштування → Очистити дані застосунку
    de: Settings → Clear app data
    fr: "Réglages → Effacer les données"
    es: "Ajustes → Borrar datos"

  data_location:
    en: Drafts and the photos you pick stay on your phone. Published packs live on Telegram under your account. Our server keeps only an anonymous app ID, your Telegram link, the list of packs you published and which plans you own — see the privacy policy.
    uk: Чернетки та вибрані фото залишаються на вашому телефоні. Опубліковані паки зберігаються в Telegram у вашому обліковому записі. Наш сервер зберігає лише анонімний ідентифікатор застосунку, прив’язку Telegram, список опублікованих паків і ваші тарифи — див. політику конфіденційності.
    de: Entwürfe und die ausgewählten Fotos bleiben auf deinem Telefon. Veröffentlichte Packs liegen auf Telegram in deinem Konto. Unser Server speichert nur eine anonyme App-ID, deine Telegram-Verknüpfung, die Liste deiner veröffentlichten Packs und deine Pläne — siehe Datenschutzerklärung.
    fr: "Les brouillons et les photos que vous choisissez restent sur votre téléphone. Les packs publiés sont hébergés par Telegram sous votre compte. Notre serveur ne conserve qu’un identifiant d’app anonyme, votre liaison Telegram, la liste des packs que vous avez publiés et les offres que vous possédez — voir la politique de confidentialité."
    es: "Los borradores y las fotos que eliges se quedan en tu teléfono. Los packs publicados están en Telegram, en tu cuenta. Nuestro servidor solo guarda un identificador de app anónimo, tu vínculo con Telegram, la lista de packs que publicaste y qué planes tienes; consulta la política de privacidad."

  warranty_note:
    en: Publishing depends on Telegram. We do not control Telegram and are not responsible if it is unavailable, changes its limits or removes a pack.
    uk: Публікація залежить від Telegram. Ми не контролюємо Telegram і не відповідаємо, якщо він недоступний, змінює обмеження або видаляє пак.
    de: Das Veröffentlichen hängt von Telegram ab. Wir haben keinen Einfluss auf Telegram und sind nicht verantwortlich, wenn es nicht erreichbar ist, seine Limits ändert oder ein Pack entfernt.
    fr: "La publication dépend de Telegram. Nous ne contrôlons pas Telegram et ne sommes pas responsables s’il est indisponible, modifie ses limites ou supprime un pack."
    es: "La publicación depende de Telegram. No controlamos Telegram y no somos responsables si no está disponible, cambia sus límites o elimina un pack."

  # Third-party services that process personal data (pubspec.yaml + server).
  sdks:
    - name: Firebase Authentication
      provider: Google LLC
      purpose: { en: Anonymous app ID, uk: Анонімний ідентифікатор застосунку, de: Anonyme App-ID, fr: "Identifiant d’app anonyme", es: "Identificador de app anónimo" }
      privacy_url: https://firebase.google.com/support/privacy
    - name: Firebase Crashlytics
      provider: Google LLC
      purpose: { en: Crash and error reports, uk: Звіти про збої та помилки, de: Absturz- und Fehlerberichte, fr: "Rapports de plantage et d’erreur", es: "Informes de fallos y errores" }
      privacy_url: https://firebase.google.com/support/privacy
    - name: Firebase Remote Config
      provider: Google LLC
      purpose: { en: App settings, uk: Налаштування застосунку, de: App-Einstellungen, fr: "Réglages de l’app", es: "Ajustes de la app" }
      privacy_url: https://firebase.google.com/support/privacy
    - name: Google AdMob
      provider: Google Ireland Limited (EEA/UK/CH), Google LLC (elsewhere)
      purpose: { en: Advertising, uk: Реклама, de: Werbung, fr: "Publicité", es: "Publicidad" }
      privacy_url: https://policies.google.com/privacy
    - name: Google User Messaging Platform
      provider: Google Ireland Limited / Google LLC
      purpose: { en: Ad consent, uk: Згода на рекламу, de: Werbe-Einwilligung, fr: "Consentement publicitaire", es: "Consentimiento para anuncios" }
      privacy_url: https://policies.google.com/privacy
    - name: Google Play Billing
      provider: Google Ireland Limited / Google LLC
      purpose: { en: Purchases, uk: Покупки, de: Käufe, fr: "Achats", es: "Compras" }
      privacy_url: https://policies.google.com/privacy
    - name: Google Play in-app updates
      provider: Google Ireland Limited / Google LLC
      purpose: { en: Update prompts, uk: Пропозиції оновлення, de: Update-Hinweise, fr: "Propositions de mise à jour", es: "Avisos de actualización" }
      privacy_url: https://policies.google.com/privacy
    - name: Cloudflare (Workers, D1)
      provider: Cloudflare, Inc.
      purpose: { en: Hosting our server, uk: Хостинг нашого сервера, de: Hosting unseres Servers, fr: "Hébergement de notre serveur", es: "Alojamiento de nuestro servidor" }
      privacy_url: https://www.cloudflare.com/privacypolicy/
    - name: Telegram (Bot API)
      provider: Telegram FZ-LLC / Telegram Messenger Inc.
      purpose: { en: Connecting your account and publishing your packs, uk: Підключення облікового запису й публікація паків, de: Konto verbinden und Packs veröffentlichen, fr: "Connexion de votre compte et publication de vos packs", es: "Conectar tu cuenta y publicar tus packs" }
      privacy_url: https://telegram.org/privacy

  # Data the app stores only on the phone.
  local_data:
    - en: Drafts — packs you haven't published yet, with their sticker images, emojis and titles
      uk: Чернетки — ще не опубліковані паки з зображеннями стікерів, емодзі та назвами
      de: Entwürfe — noch nicht veröffentlichte Packs mit Sticker-Bildern, Emojis und Titeln
      fr: "Brouillons — les packs pas encore publiés, avec leurs images de stickers, leurs emoji et leurs titres"
      es: "Borradores: los packs que aún no has publicado, con sus imágenes de stickers, emoji y títulos"
    - en: Photos you pick or take. They are cropped and turned into stickers on the phone; the original photos are never uploaded
      uk: Фото, які ви вибираєте чи знімаєте. Їх обрізають і перетворюють на стікери на телефоні; оригінальні фото ніколи не завантажуються
      de: Fotos, die du auswählst oder aufnimmst. Sie werden auf dem Telefon zugeschnitten und zu Stickern gemacht; die Originalfotos werden nie hochgeladen
      fr: "Les photos que vous choisissez ou prenez. Elles sont recadrées et transformées en stickers sur le téléphone ; les photos originales ne sont jamais envoyées"
      es: "Las fotos que eliges o haces. Se recortan y se convierten en stickers en el teléfono; las fotos originales nunca se suben"
    - en: Cached images of your published stickers
      uk: Кешовані зображення ваших опублікованих стікерів
      de: Zwischengespeicherte Bilder deiner veröffentlichten Sticker
      fr: "Les images en cache de vos stickers publiés"
      es: "Imágenes en caché de tus stickers publicados"
    - en: Settings (theme, language), recently used emojis and whether you accepted the terms
      uk: Налаштування (тема, мова), нещодавні емодзі та чи прийняли ви умови
      de: Einstellungen (Design, Sprache), zuletzt genutzte Emojis und ob du die Bedingungen akzeptiert hast
      fr: "Réglages (thème, langue), emoji récents et acceptation des conditions"
      es: "Ajustes (tema, idioma), emoji recientes y si aceptaste las condiciones"

  faq:
    - q:
        en: Why do I need to connect Telegram?
        uk: Навіщо підключати Telegram?
        de: Warum muss ich Telegram verbinden?
        fr: "Pourquoi dois-je connecter Telegram ?"
        es: "¿Por qué tengo que conectar Telegram?"
      a:
        en: Packs are published on Telegram under your account, and our bot @StickerzzzApp_bot creates them for you. You can make stickers without connecting and connect when you publish (Settings → Telegram).
        uk: Паки публікуються в Telegram у вашому обліковому записі, і створює їх наш бот @StickerzzzApp_bot. Робити стікери можна й без підключення — підключіться, коли публікуватимете (Налаштування → Telegram).
        de: Packs werden auf Telegram in deinem Konto veröffentlicht; unser Bot @StickerzzzApp_bot erstellt sie für dich. Sticker kannst du auch ohne Verbindung machen und erst beim Veröffentlichen verbinden (Settings → Telegram).
        fr: "Les packs sont publiés sur Telegram sous votre compte, et notre bot @StickerzzzApp_bot les crée pour vous. Vous pouvez créer des stickers sans connexion et vous connecter au moment de publier (Réglages → Telegram)."
        es: "Los packs se publican en Telegram en tu cuenta y nuestro bot @StickerzzzApp_bot los crea por ti. Puedes hacer stickers sin conectarte y conectarte cuando publiques (Ajustes → Telegram)."
    - q:
        en: I changed phones or cleared app data. Where are my packs?
        uk: Я змінив(-ла) телефон або очистив(-ла) дані. Де мої паки?
        de: Ich habe das Telefon gewechselt oder die App-Daten gelöscht. Wo sind meine Packs?
        fr: "J’ai changé de téléphone ou effacé les données de l’app. Où sont mes packs ?"
        es: "He cambiado de teléfono o he borrado los datos de la app. ¿Dónde están mis packs?"
      a:
        en: Published packs stay on Telegram. Connect the same Telegram account again in Settings to see and edit them. Drafts were stored only on the old phone and can't be recovered.
        uk: Опубліковані паки залишаються в Telegram. Підключіть той самий обліковий запис Telegram у Налаштуваннях, щоб бачити й редагувати їх. Чернетки зберігалися лише на старому телефоні, їх не відновити.
        de: Veröffentlichte Packs bleiben auf Telegram. Verbinde in den Settings dasselbe Telegram-Konto erneut, um sie zu sehen und zu bearbeiten. Entwürfe lagen nur auf dem alten Telefon und lassen sich nicht wiederherstellen.
        fr: "Les packs publiés restent sur Telegram. Reconnectez le même compte Telegram dans les Réglages pour les voir et les modifier. Les brouillons n’étaient stockés que sur l’ancien téléphone et ne peuvent pas être récupérés."
        es: "Los packs publicados se quedan en Telegram. Vuelve a conectar la misma cuenta de Telegram en Ajustes para verlos y editarlos. Los borradores solo estaban en el teléfono antiguo y no se pueden recuperar."
    - q:
        en: How do I delete a published pack?
        uk: Як видалити опублікований пак?
        de: Wie lösche ich ein veröffentlichtes Pack?
        fr: "Comment supprimer un pack publié ?"
        es: "¿Cómo borro un pack publicado?"
      a:
        en: Open the pack, tap ⋯ → Delete pack. It is deleted on Telegram too.
        uk: Відкрийте пак, натисніть ⋯ → Видалити пак. Його буде видалено і в Telegram.
        de: Öffne das Pack und tippe auf ⋯ → Delete pack. Es wird auch auf Telegram gelöscht.
        fr: "Ouvrez le pack, touchez ⋯ → Supprimer le pack. Il est aussi supprimé sur Telegram."
        es: "Abre el pack y toca ⋯ → Borrar pack. También se borra en Telegram."

rapid-sudoku:
  name: Rapid Sudoku
  tagline:
    en: Sudoku against the clock — Rapid levels, two dailies a day and Classic games without a timer.
    uk: Судоку на час — рівні Rapid, два щоденні пазли та класичні ігри без таймера.
    de: Sudoku gegen die Uhr — Rapid-Level, zwei tägliche Rätsel und klassische Spiele ohne Timer.
    fr: "Le sudoku contre la montre — niveaux Rapid, deux grilles quotidiennes et parties classiques sans chrono."
    es: "Sudoku contrarreloj: niveles Rapid, dos retos diarios y partidas clásicas sin cronómetro."
  email_tag: rapidsudoku             # plus-alias tag, used only if studio.support.plus_aliases
  effective_date: 2026-10-30
  stores:
    ios: ""                          # App Store URL once live (iPhone only)
    android: ""                      # https://play.google.com/store/apps/details?id=com.eizdev.rapidsudoku

  # AdMob (app repo lib/core/ads/): full-screen ads when leaving the Rapid and Daily
  # result screens, paced; a rewarded video as an alternative to coins for the first
  # continue of a game, granted on the phone. UMP consent first on both platforms; on
  # iOS every request is non-personalized and there is no ATT prompt (app repo D46).
  # The app is English only, so the other languages show the English path.
  ads: true
  ads_privacy_path:
    en: Settings → Ad privacy choices
    uk: Settings → Ad privacy choices
    de: Settings → Ad privacy choices
    fr: "Settings → Ad privacy choices"
    es: "Settings → Ad privacy choices"
  ad_formats:
    en: full-screen ads after some game results, and rewarded videos you can choose to watch for one extra continue in a game
    uk: повноекранну рекламу після деяких результатів гри та відео з винагородою, які ви можете переглянути, щоб один раз продовжити гру
    de: Vollbildanzeigen nach manchen Spielergebnissen und Videos mit Belohnung, die du freiwillig ansehen kannst, um ein Spiel einmal fortzusetzen
    fr: "des publicités plein écran après certains résultats de partie, et des vidéos avec récompense que vous pouvez choisir de regarder pour continuer une partie une fois"
    es: "anuncios a pantalla completa tras algunos resultados de partida y vídeos con recompensa que puedes elegir ver para continuar una partida una vez"
  ads_note:
    en: On iPhone the app never asks for permission to track you and requests only non-personalised ads, whatever you answer in the consent message. Google still uses the data above there to show, cap and measure ads and to prevent fraud, but not to personalise them.
    uk: На iPhone застосунок ніколи не просить дозволу на відстеження і запитує лише неперсоналізовану рекламу, хоч би що ви відповіли в запиті на згоду. Google і там використовує наведені вище дані, щоб показувати, обмежувати й вимірювати рекламу та запобігати шахрайству, але не для персоналізації.
    de: Auf dem iPhone fragt die App nie nach der Erlaubnis, dich zu tracken, und fordert nur nicht personalisierte Anzeigen an, egal was du in der Einwilligungsabfrage wählst. Google nutzt die oben genannten Daten dort weiterhin, um Anzeigen auszuliefern, zu begrenzen und zu messen und Betrug zu verhindern, aber nicht zur Personalisierung.
    fr: "Sur iPhone, l’app ne demande jamais l’autorisation de vous suivre et ne demande que des publicités non personnalisées, quelle que soit votre réponse au message de consentement. Google y utilise toujours les données ci-dessus pour diffuser, limiter et mesurer les publicités et prévenir la fraude, mais pas pour les personnaliser."
    es: "En iPhone la app nunca pide permiso para rastrearte y solo solicita anuncios no personalizados, respondas lo que respondas en el mensaje de consentimiento. Google sigue usando allí los datos anteriores para mostrar, limitar y medir anuncios y prevenir el fraude, pero no para personalizarlos."
  # Remove ads turns off the interstitials only; the rewarded continue stays for
  # everyone, so the ad SDK still starts (after consent) for owners too (D4, D5).
  ads_paid_note:
    en: Remove ads turns off the full-screen ads; rewarded videos only play when you choose to watch one.
    uk: "«Remove ads» вимикає повноекранну рекламу; відео з винагородою відтворюються лише тоді, коли ви самі вирішите його переглянути."
    de: "„Remove ads“ schaltet die Vollbildanzeigen ab; Belohnungsvideos laufen nur, wenn du selbst eins ansehen möchtest."
    fr: "« Remove ads » désactive les publicités plein écran ; les vidéos avec récompense ne se lancent que si vous choisissez d’en regarder une."
    es: "«Remove ads» desactiva los anuncios a pantalla completa; los vídeos con recompensa solo se reproducen cuando eliges ver uno."

  # Google Play Billing on Android, StoreKit 2 on iOS: the non-consumable remove_ads and
  # the consumable coin bundles coins_10/20/50/100. Checked on the phone only (no server).
  # On iOS a Keychain copy of the coin balance, login streak and remove-ads flag survives
  # deleting the app (app repo T12.3).
  iap: true
  iap_kind: one_time
  premium_name: Remove ads
  iap_note:
    en: Coin bundles are consumable. The coins are added on this device only, and the stores can't restore them. After a reinstall they come back only from your phone itself — Android's own backup, or on iPhone the copy the app keeps in the phone's Keychain. Only Remove ads can be restored.
    uk: Набори монет — витратні покупки. Монети додаються лише на цьому пристрої, і магазини не можуть їх відновити. Після перевстановлення вони повертаються лише з самого телефона — з власної резервної копії Android або, на iPhone, з копії, яку застосунок зберігає у Keychain (Зв’язці ключів) телефона. Відновити можна лише «Remove ads».
    de: Münzpakete sind Verbrauchsartikel. Die Münzen werden nur auf diesem Gerät gutgeschrieben, und die Stores können sie nicht wiederherstellen. Nach einer Neuinstallation kommen sie nur vom Telefon selbst zurück — aus der eigenen Android-Sicherung oder auf dem iPhone aus der Kopie, die die App im Schlüsselbund (Keychain) des Telefons ablegt. Nur „Remove ads“ lässt sich wiederherstellen.
    fr: "Les packs de pièces sont des achats consommables. Les pièces sont ajoutées sur cet appareil uniquement, et les stores ne peuvent pas les restaurer. Après une réinstallation, elles ne reviennent que depuis le téléphone lui-même : la sauvegarde d’Android ou, sur iPhone, la copie que l’app garde dans le trousseau (Keychain) du téléphone. Seul « Remove ads » peut être restauré."
    es: "Los paquetes de monedas son compras consumibles. Las monedas se añaden solo en este dispositivo y las tiendas no pueden restaurarlas. Tras reinstalar, solo vuelven desde el propio teléfono: la copia de seguridad de Android o, en iPhone, la copia que la app guarda en el llavero (Keychain) del teléfono. Solo «Remove ads» se puede restaurar."
  restore_note:
    en: Open **Settings → Restore purchases**, signed in to the same Apple Account or Google account you bought Remove ads with. Coin bundles can't be restored.
    uk: Відкрийте **Settings → Restore purchases**, увійшовши в той самий обліковий запис Apple або Google, з якого купували «Remove ads». Набори монет відновити не можна.
    de: Öffne **Settings → Restore purchases**, angemeldet mit demselben Apple Account oder Google-Konto, mit dem du „Remove ads“ gekauft hast. Münzpakete lassen sich nicht wiederherstellen.
    fr: "Ouvrez **Settings → Restore purchases**, connecté au même compte Apple ou Google que celui utilisé pour acheter « Remove ads ». Les packs de pièces ne peuvent pas être restaurés."
    es: "Abre **Settings → Restore purchases** con la misma cuenta de Apple o de Google con la que compraste «Remove ads». Los paquetes de monedas no se pueden restaurar."
  accounts: false                    # no accounts, no own server (Play Games / Game Center sign-in only for leaderboards)
  analytics: false                   # no analytics, no crash reporting (D15)

  # "Settings → Delete my data" (app repo lib/core/storage/local_data_wiper.dart, D23).
  # It also rewrites the iOS Keychain copy with the wiped state; deleting the app on
  # iOS leaves that copy behind, hence delete_data_note.
  # The app is English only, so every language shows the English labels.
  delete_data_path:
    en: Settings → Delete my data
    uk: Settings → Delete my data
    de: Settings → Delete my data
    fr: "Settings → Delete my data"
    es: "Settings → Delete my data"
  delete_data_note:
    en: Uninstalling the app deletes everything as well, except on iPhone, where the small Keychain copy of your coins, login streak and Remove ads stays so that a reinstall gets them back; Delete my data resets that copy too.
    uk: Видалення застосунку також видаляє все, крім iPhone, де лишається невелика копія ваших монет, серії входів і «Remove ads» у Keychain, щоб після перевстановлення їх повернути; «Delete my data» скидає і цю копію.
    de: Auch das Deinstallieren löscht alles, außer auf dem iPhone, wo die kleine Schlüsselbund-Kopie deiner Münzen, deiner Login-Serie und von „Remove ads“ bleibt, damit eine Neuinstallation sie zurückholt; „Delete my data“ setzt auch diese Kopie zurück.
    fr: "Désinstaller l’app supprime aussi tout, sauf sur iPhone, où la petite copie de vos pièces, de votre série de connexions et de « Remove ads » reste dans le trousseau pour qu’une réinstallation les retrouve ; « Delete my data » réinitialise aussi cette copie."
    es: "Desinstalar la app también lo borra todo, salvo en iPhone, donde la pequeña copia de tus monedas, tu racha de inicios y «Remove ads» se queda en el llavero para que una reinstalación las recupere; «Delete my data» también restablece esa copia."

  data_location:
    en: Everything stays on your phone (and in your phone's own backup, if it is on). Scores you play for the leaderboards go to Google Play Games on Android or Game Center on iPhone, under your profile there. The leaderboard screen also shows the public names and pictures of today's top players from that service; the app doesn't keep them. We have no server.
    uk: Усе зберігається на вашому телефоні (і в його власній резервній копії, якщо її ввімкнено). Результати для таблиць лідерів надсилаються в Google Play Games на Android або в Game Center на iPhone, у ваш профіль там. Екран таблиці лідерів також показує публічні імена й зображення найкращих гравців дня з цього сервісу; застосунок їх не зберігає. Власного сервера в нас немає.
    de: Alles bleibt auf deinem Telefon (und in seiner eigenen Sicherung, falls aktiviert). Ergebnisse für die Bestenlisten gehen auf Android an Google Play Games und auf dem iPhone an Game Center, in dein Profil dort. Die Bestenliste zeigt auch die öffentlichen Namen und Bilder der besten Spieler des Tages aus diesem Dienst; die App speichert sie nicht. Wir haben keinen Server.
    fr: "Tout reste sur votre téléphone (et dans sa propre sauvegarde, si elle est activée). Les scores des classements sont envoyés à Google Play Games sur Android ou à Game Center sur iPhone, dans votre profil. L’écran des classements affiche aussi les noms et images publics des meilleurs joueurs du jour fournis par ce service ; l’app ne les conserve pas. Nous n’avons pas de serveur."
    es: "Todo se queda en tu teléfono (y en su propia copia de seguridad, si está activada). Las puntuaciones de las clasificaciones van a Google Play Juegos en Android o a Game Center en iPhone, a tu perfil allí. La pantalla de clasificación también muestra los nombres e imágenes públicos de los mejores jugadores del día de ese servicio; la app no los guarda. No tenemos servidor."

  warranty_note:
    en: "Leaderboards and sign-in depend on Google Play Games (Android) and Game Center (iPhone). We do not control them and are not responsible if they are unavailable or change. Your progress and coins live on your device; we cannot recover them if they are lost."
    uk: "Таблиці лідерів і вхід залежать від Google Play Games (Android) і Game Center (iPhone). Ми не контролюємо ці сервіси і не відповідаємо, якщо вони недоступні або змінюються. Ваш прогрес і монети зберігаються на вашому пристрої; ми не можемо відновити їх у разі втрати."
    de: "Bestenlisten und Anmeldung hängen von Google Play Games (Android) und Game Center (iPhone) ab. Wir haben keinen Einfluss darauf und sind nicht verantwortlich, wenn sie nicht erreichbar sind oder sich ändern. Dein Fortschritt und deine Münzen liegen auf deinem Gerät; gehen sie verloren, können wir sie nicht wiederherstellen."
    fr: "Les classements et la connexion dépendent de Google Play Games (Android) et de Game Center (iPhone). Nous ne les contrôlons pas et ne sommes pas responsables s’ils sont indisponibles ou changent. Votre progression et vos pièces restent sur votre appareil ; nous ne pouvons pas les récupérer en cas de perte."
    es: "Las clasificaciones y el inicio de sesión dependen de Google Play Juegos (Android) y Game Center (iPhone). No los controlamos y no somos responsables si no están disponibles o cambian. Tu progreso y tus monedas están en tu dispositivo; no podemos recuperarlos si se pierden."

  # Third-party SDKs and platform services that process personal data (app repo docs/legal/FACTS.md).
