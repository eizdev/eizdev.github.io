  # Data the app stores locally (never sent to us).
  local_data:
    - en: Your games in progress, levels and daily puzzles
      uk: Ваші незавершені ігри, рівні та щоденні пазли
      de: Deine laufenden Spiele, Level und täglichen Rätsel
      fr: "Vos parties en cours, niveaux et grilles quotidiennes"
      es: "Tus partidas en curso, niveles y retos diarios"
    - en: Your coins and their history (a coin purchase is recorded with the store's order or transaction number)
      uk: Ваші монети та їхня історія (покупка монет записується з номером замовлення чи транзакції магазину)
      de: Deine Münzen und ihr Verlauf (ein Münzkauf wird mit der Bestell- oder Transaktionsnummer des Stores gespeichert)
      fr: "Vos pièces et leur historique (un achat de pièces est enregistré avec le numéro de commande ou de transaction du store)"
      es: "Tus monedas y su historial (una compra de monedas se guarda con el número de pedido o de transacción de la tienda)"
    - en: Best scores, daily results and scores waiting to be sent to the leaderboards
      uk: Найкращі результати, щоденні результати та результати, що чекають на надсилання в таблиці лідерів
      de: Bestwerte, Tagesergebnisse und Ergebnisse, die noch an die Bestenlisten gesendet werden
      fr: "Meilleurs scores, résultats quotidiens et scores en attente d’envoi aux classements"
      es: "Mejores puntuaciones, resultados diarios y puntuaciones pendientes de enviar a las clasificaciones"
    - en: Settings, your login streak and whether Remove ads is owned
      uk: Налаштування, ваша серія входів і чи придбано «Remove ads»
      de: Einstellungen, deine Login-Serie und ob „Remove ads“ gekauft ist
      fr: "Réglages, votre série de connexions et l’achat éventuel de « Remove ads »"
      es: "Ajustes, tu racha de inicios y si tienes «Remove ads»"
    - en: "On iPhone only: a small copy of your coin balance, login streak and Remove ads in the phone's Keychain, so that a reinstall gets them back. It stays on the iPhone when you delete the app (it is not synced to iCloud Keychain); Delete my data resets it."
      uk: "Лише на iPhone: невелика копія балансу монет, серії входів і «Remove ads» у Keychain (Зв’язці ключів) телефона, щоб після перевстановлення їх повернути. Вона лишається на iPhone після видалення застосунку (не синхронізується з iCloud Keychain); «Delete my data» її скидає."
      de: "Nur auf dem iPhone: eine kleine Kopie deines Münzstands, deiner Login-Serie und von „Remove ads“ im Schlüsselbund (Keychain) des Telefons, damit eine Neuinstallation sie zurückholt. Sie bleibt auf dem iPhone, wenn du die App löschst (sie wird nicht mit dem iCloud-Schlüsselbund synchronisiert); „Delete my data“ setzt sie zurück."
      fr: "Sur iPhone uniquement : une petite copie de votre solde de pièces, de votre série de connexions et de « Remove ads » dans le trousseau (Keychain) du téléphone, pour qu’une réinstallation les retrouve. Elle reste sur l’iPhone quand vous supprimez l’app (elle n’est pas synchronisée avec le trousseau iCloud) ; « Delete my data » la réinitialise."
      es: "Solo en iPhone: una pequeña copia de tu saldo de monedas, tu racha de inicios y «Remove ads» en el llavero (Keychain) del teléfono, para que una reinstalación los recupere. Se queda en el iPhone al borrar la app (no se sincroniza con el llavero de iCloud); «Delete my data» la restablece."

  # App-specific FAQ for the support page (generic purchase/data/ads answers
  # are added automatically from the flags above).
  faq:
    - q:
        en: Do my coins come back after I reinstall the app or change phones?
        uk: Чи повернуться мої монети після перевстановлення застосунку або зміни телефона?
        de: Bekomme ich meine Münzen nach einer Neuinstallation oder einem Telefonwechsel zurück?
        fr: "Mes pièces reviennent-elles si je réinstalle l’app ou change de téléphone ?"
        es: "¿Recupero mis monedas si reinstalo la app o cambio de teléfono?"
      a:
        en: On Android, yes, if backup is on in your phone's settings — they come back from your phone's Google backup as of the last backup (at most about a day old). On iPhone, yes after a reinstall on the same iPhone, from the copy the app keeps in the Keychain; on a new iPhone, if you set it up from an encrypted iCloud or computer backup. The stores can't restore coin purchases, and we can't either, because we have no server.
        uk: "На Android — так, якщо в налаштуваннях телефона ввімкнено резервне копіювання: монети повернуться з резервної копії Google станом на останнє копіювання (щонайбільше приблизно добової давності). На iPhone — так після перевстановлення на тому самому iPhone, з копії, яку застосунок зберігає в Keychain; на новому iPhone — якщо ви налаштували його із зашифрованої резервної копії iCloud або комп’ютера. Магазини не можуть відновити покупки монет, і ми теж, бо в нас немає сервера."
        de: Auf Android ja, wenn die Sicherung in den Telefoneinstellungen aktiv ist — sie kommen aus der Google-Sicherung deines Telefons zurück, Stand der letzten Sicherung (höchstens etwa einen Tag alt). Auf dem iPhone ja nach einer Neuinstallation auf demselben iPhone, aus der Kopie, die die App im Schlüsselbund ablegt; auf einem neuen iPhone, wenn du es aus einer verschlüsselten iCloud- oder Computer-Sicherung einrichtest. Die Stores können Münzkäufe nicht wiederherstellen, und wir auch nicht, da wir keinen Server haben.
        fr: "Sur Android, oui, si la sauvegarde est activée dans les réglages du téléphone : elles reviennent depuis la sauvegarde Google du téléphone, dans l’état de la dernière sauvegarde (au plus environ un jour). Sur iPhone, oui après une réinstallation sur le même iPhone, depuis la copie que l’app garde dans le trousseau ; sur un nouvel iPhone, si vous le configurez depuis une sauvegarde chiffrée iCloud ou sur ordinateur. Les stores ne peuvent pas restaurer les achats de pièces, et nous non plus, car nous n’avons pas de serveur."
        es: "En Android, sí, si la copia de seguridad está activada en los ajustes del teléfono: vuelven desde la copia de Google del teléfono, tal como estaban en la última copia (como mucho de hace un día). En iPhone, sí tras reinstalar en el mismo iPhone, desde la copia que la app guarda en el llavero; en un iPhone nuevo, si lo configuras desde una copia cifrada de iCloud o del ordenador. Las tiendas no pueden restaurar compras de monedas, ni nosotros, porque no tenemos servidor."
    - q:
        en: When do the daily puzzles change?
        uk: Коли змінюються щоденні пазли?
        de: Wann wechseln die täglichen Rätsel?
        fr: "Quand les grilles quotidiennes changent-elles ?"
        es: "¿Cuándo cambian los retos diarios?"
      a:
        en: Every day at midnight Pacific time (Los Angeles), when the daily leaderboards on Google Play Games and Game Center reset. Daily coins and the login streak use the same day. New dailies need an internet connection; one you already started can be finished offline.
        uk: Щодня опівночі за тихоокеанським часом (Лос-Анджелес), коли оновлюються щоденні таблиці лідерів у Google Play Games і Game Center. Щоденні монети та серія входів рахуються за тим самим днем. Для нових щоденних пазлів потрібен інтернет; уже розпочатий можна завершити офлайн.
        de: Jeden Tag um Mitternacht pazifischer Zeit (Los Angeles), wenn die Tagesbestenlisten bei Google Play Games und Game Center zurückgesetzt werden. Tägliche Münzen und die Login-Serie nutzen denselben Tag. Neue Tagesrätsel brauchen eine Internetverbindung; ein begonnenes kannst du offline beenden.
        fr: "Chaque jour à minuit, heure du Pacifique (Los Angeles), quand les classements du jour de Google Play Games et de Game Center sont réinitialisés. Les pièces quotidiennes et la série de connexions suivent le même jour. Les nouvelles grilles demandent une connexion ; une grille déjà commencée peut être terminée hors ligne."
        es: "Cada día a medianoche, hora del Pacífico (Los Ángeles), cuando se reinician las clasificaciones diarias de Google Play Juegos y Game Center. Las monedas diarias y la racha de inicios usan el mismo día. Los retos nuevos necesitan conexión; uno ya empezado se puede terminar sin conexión."
    - q:
        en: How do I remove my scores from the leaderboards?
        uk: Як видалити мої результати з таблиць лідерів?
        de: Wie entferne ich meine Ergebnisse aus den Bestenlisten?
        fr: "Comment supprimer mes scores des classements ?"
        es: "¿Cómo borro mis puntuaciones de las clasificaciones?"
      a:
        en: Leaderboard scores are kept by Google Play Games (in your Play Games profile) or by Apple's Game Center (with your Apple Account), not by us, so Settings → Delete my data doesn't remove them. On Android, manage or delete your Play Games data in the Google Play Games app's settings; on iPhone, Apple's Data and Privacy page (privacy.apple.com) handles Game Center data.
        uk: Результати в таблицях лідерів зберігає Google Play Games (у вашому профілі Play Games) або Game Center від Apple (з вашим обліковим записом Apple), а не ми, тому Settings → Delete my data їх не видаляє. На Android керуйте даними Play Games або видаліть їх у налаштуваннях застосунку Google Play Games; на iPhone даними Game Center керує сторінка Apple «Дані та конфіденційність» (privacy.apple.com).
        de: Die Ergebnisse der Bestenlisten speichert Google Play Games (in deinem Play-Games-Profil) oder Apples Game Center (mit deinem Apple Account), nicht wir, daher entfernt Settings → Delete my data sie nicht. Auf Android verwaltest oder löschst du deine Play-Games-Daten in den Einstellungen der Google-Play-Games-App; auf dem iPhone kümmert sich Apples Seite „Daten und Datenschutz“ (privacy.apple.com) um Game-Center-Daten.
        fr: "Les scores des classements sont conservés par Google Play Games (dans votre profil Play Jeux) ou par Game Center d’Apple (avec votre compte Apple), pas par nous ; Settings → Delete my data ne les supprime donc pas. Sur Android, gérez ou supprimez vos données Play Jeux dans les réglages de l’app Google Play Jeux ; sur iPhone, la page « Données et confidentialité » d’Apple (privacy.apple.com) gère les données Game Center."
        es: "Las puntuaciones las guarda Google Play Juegos (en tu perfil de Play Juegos) o Game Center de Apple (con tu cuenta de Apple), no nosotros, así que Settings → Delete my data no las borra. En Android, gestiona o borra tus datos de Play Juegos en los ajustes de la app Google Play Juegos; en iPhone, la página «Datos y privacidad» de Apple (privacy.apple.com) gestiona los datos de Game Center."
