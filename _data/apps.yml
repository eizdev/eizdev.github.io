  # Binance is not an SDK: the app calls its public market-data API directly (FACTS "Requests to third parties").
  # Coin logos (app A2 / D31, 2026-11-03): plain image GETs to CoinCap's icon CDN, second paragraph.
  third_party_note:
    en: "**Market data.** To show live prices, the app downloads public market data (prices, best bid and ask, funding rates, price history and trading rules) directly from Binance's public servers. It sends no account, key or identifier, and never your portfolios or trades. As with any request on the internet, Binance receives your IP address, the time and which markets are requested, and processes them as an independent controller under its own [privacy policy](https://www.binance.com/en/privacy). The app has no Binance account or login.\n\n**Coin logos.** To show each coin's logo, the app downloads the image from CoinCap's public icon server (assets.coincap.io, run by Haiku Strategies LLC and delivered through Cloudflare). The request is a plain image download with no account, key or identifier and nothing about you or your portfolios; CoinCap receives your IP address, the time and which coin logos are requested, under its own [privacy policy](https://coincap.io/terms-of-service?tab=privacy). Downloaded logos are kept on your phone so they are not fetched again. Coin logos are the trademarks of their projects and are shown only to identify each coin."
    uk: "**Ринкові дані.** Щоб показувати живі ціни, застосунок завантажує публічні ринкові дані (ціни, найкращі ціни купівлі й продажу, ставки фандингу, історію цін і правила торгівлі) безпосередньо з публічних серверів Binance. Він не надсилає жодного облікового запису, ключа чи ідентифікатора і ніколи — ваших портфелів чи угод. Як і за будь-якого запиту в інтернеті, Binance отримує вашу IP-адресу, час і те, які ринки запитуються, та обробляє їх як самостійний контролер згідно з власною [політикою конфіденційності](https://www.binance.com/en/privacy). У застосунку немає облікового запису чи входу в Binance.\n\n**Логотипи монет.** Щоб показати логотип кожної монети, застосунок завантажує зображення з публічного сервера іконок CoinCap (assets.coincap.io, яким керує Haiku Strategies LLC, доставка через Cloudflare). Запит — це звичайне завантаження зображення без облікового запису, ключа чи ідентифікатора і без будь-яких даних про вас або ваші портфелі; CoinCap отримує вашу IP-адресу, час і те, логотипи яких монет запитуються, згідно з власною [політикою конфіденційності](https://coincap.io/terms-of-service?tab=privacy). Завантажені логотипи зберігаються на вашому телефоні, тож повторно не завантажуються. Логотипи монет є торговельними марками їхніх проєктів і показуються лише для того, щоб розпізнати монету."
    de: "**Marktdaten.** Für Live-Preise lädt die App öffentliche Marktdaten (Preise, bestes Gebot und bester Briefkurs, Funding-Raten, Kursverlauf und Handelsregeln) direkt von den öffentlichen Servern von Binance. Sie sendet kein Konto, keinen Schlüssel und keine Kennung und niemals deine Portfolios oder Trades. Wie bei jeder Anfrage im Internet erhält Binance deine IP-Adresse, die Uhrzeit und welche Märkte abgefragt werden, und verarbeitet sie als eigenständiger Verantwortlicher nach seiner eigenen [Datenschutzerklärung](https://www.binance.com/en/privacy). Die App hat kein Binance-Konto und keine Anmeldung bei Binance.\n\n**Coin-Logos.** Um das Logo jeder Kryptowährung zu zeigen, lädt die App das Bild vom öffentlichen Icon-Server von CoinCap (assets.coincap.io, betrieben von Haiku Strategies LLC, ausgeliefert über Cloudflare). Die Anfrage ist ein einfacher Bild-Download ohne Konto, Schlüssel oder Kennung und ohne Angaben über dich oder deine Portfolios; CoinCap erhält deine IP-Adresse, die Uhrzeit und welche Coin-Logos abgefragt werden, nach seiner eigenen [Datenschutzerklärung](https://coincap.io/terms-of-service?tab=privacy). Geladene Logos bleiben auf deinem Telefon gespeichert und werden nicht erneut abgerufen. Coin-Logos sind Marken ihrer Projekte und dienen nur dazu, die jeweilige Kryptowährung zu erkennen."
    fr: "**Données de marché.** Pour afficher les prix en direct, l’app télécharge des données de marché publiques (prix, meilleurs prix acheteur et vendeur, taux de financement, historique des prix et règles de trading) directement depuis les serveurs publics de Binance. Elle n’envoie aucun compte, clé ni identifiant, et jamais vos portefeuilles ni vos transactions. Comme pour toute requête sur Internet, Binance reçoit votre adresse IP, l’heure et les marchés demandés, et les traite en tant que responsable de traitement indépendant selon sa propre [politique de confidentialité](https://www.binance.com/en/privacy). L’app n’a ni compte ni connexion Binance.\n\n**Logos des cryptos.** Pour afficher le logo de chaque crypto, l’app télécharge l’image depuis le serveur d’icônes public de CoinCap (assets.coincap.io, exploité par Haiku Strategies LLC et distribué via Cloudflare). La requête est un simple téléchargement d’image, sans compte, clé ni identifiant, et sans rien sur vous ou vos portefeuilles ; CoinCap reçoit votre adresse IP, l’heure et les logos demandés, selon sa propre [politique de confidentialité](https://coincap.io/terms-of-service?tab=privacy). Les logos téléchargés sont conservés sur votre téléphone pour ne pas être récupérés à nouveau. Les logos des cryptos sont des marques de leurs projets et ne servent qu’à identifier chaque crypto."
    es: "**Datos de mercado.** Para mostrar precios en directo, la app descarga datos de mercado públicos (precios, mejor oferta de compra y de venta, tasas de financiación, historial de precios y reglas de trading) directamente de los servidores públicos de Binance. No envía ninguna cuenta, clave ni identificador, y nunca tus carteras ni tus operaciones. Como con cualquier solicitud en internet, Binance recibe tu dirección IP, la hora y qué mercados se consultan, y los trata como responsable independiente según su propia [política de privacidad](https://www.binance.com/en/privacy). La app no tiene cuenta ni inicio de sesión de Binance.\n\n**Logotipos de las criptomonedas.** Para mostrar el logotipo de cada criptomoneda, la app descarga la imagen del servidor público de iconos de CoinCap (assets.coincap.io, gestionado por Haiku Strategies LLC y servido a través de Cloudflare). La solicitud es una simple descarga de imagen, sin cuenta, clave ni identificador, y sin nada sobre ti o tus carteras; CoinCap recibe tu dirección IP, la hora y qué logotipos se solicitan, según su propia [política de privacidad](https://coincap.io/terms-of-service?tab=privacy). Los logotipos descargados se guardan en tu teléfono para no volver a descargarlos. Los logotipos de las criptomonedas son marcas de sus proyectos y solo se muestran para identificar cada criptomoneda."

  # Data the app stores locally (never sent to us).
  local_data:
    - en: Your portfolios (the names you type), deposits, orders, trades, positions and holdings, with their history (fees, funding, profit and loss, daily balances)
      uk: Ваші портфелі (назви, які ви вводите), поповнення, ордери, угоди, позиції та активи разом з їхньою історією (комісії, фандинг, прибуток і збиток, щоденні баланси)
      de: Deine Portfolios (die Namen, die du eingibst), Einzahlungen, Orders, Trades, Positionen und Bestände mit ihrem Verlauf (Gebühren, Funding, Gewinn und Verlust, tägliche Salden)
      fr: "Vos portefeuilles (les noms que vous saisissez), dépôts, ordres, transactions, positions et avoirs, avec leur historique (frais, financement, gains et pertes, soldes quotidiens)"
      es: "Tus carteras (los nombres que escribes), depósitos, órdenes, operaciones, posiciones y saldos, con su historial (comisiones, financiación, pérdidas y ganancias, saldos diarios)"
    - en: A copy of Binance's public trading rules for each market, so the app can check orders
      uk: Копія публічних правил торгівлі Binance для кожного ринку, щоб застосунок міг перевіряти ордери
      de: Eine Kopie der öffentlichen Handelsregeln von Binance für jeden Markt, damit die App Orders prüfen kann
      fr: "Une copie des règles de trading publiques de Binance pour chaque marché, pour que l’app puisse vérifier les ordres"
      es: "Una copia de las reglas de trading públicas de Binance para cada mercado, para que la app pueda comprobar las órdenes"
    - en: Settings, your trade counts and the extra trades earned from ads, and whether Premium is unlocked
      uk: Налаштування, лічильники угод і додаткові угоди, отримані за рекламу, та чи розблоковано Premium
      de: Einstellungen, deine Trade-Zähler und die durch Werbung verdienten Zusatz-Trades sowie ob Premium freigeschaltet ist
      fr: "Réglages, vos compteurs de transactions et les transactions supplémentaires gagnées grâce aux publicités, et le déblocage éventuel de Premium"
      es: "Ajustes, tus contadores de operaciones y las operaciones extra ganadas con anuncios, y si Premium está desbloqueado"
    - en: Whether the ad consent message has run and when the last full-screen ad showed (your consent choice itself is stored by Google's consent software on the device)
      uk: Чи показувався запит на згоду щодо реклами і коли востаннє показувалася повноекранна реклама (саму вашу відповідь зберігає на пристрої програмне забезпечення Google для згоди)
      de: Ob die Werbe-Einwilligungsabfrage gelaufen ist und wann die letzte Vollbildanzeige kam (deine Einwilligung selbst speichert Googles Einwilligungssoftware auf dem Gerät)
      fr: "Si le message de consentement publicitaire a été affiché et quand la dernière publicité plein écran est apparue (votre choix de consentement lui-même est enregistré sur l’appareil par le logiciel de consentement de Google)"
      es: "Si se mostró el mensaje de consentimiento para anuncios y cuándo apareció el último anuncio a pantalla completa (tu elección de consentimiento la guarda en el dispositivo el software de consentimiento de Google)"
    - en: "Backup files you export (Settings → Data & account → Back up to file) are not encrypted and go only where you save or share them; the app keeps no copy"
      uk: "Файли резервних копій, які ви експортуєте (Settings → Data & account → Back up to file), не зашифровані й потрапляють лише туди, куди ви їх збережете чи надішлете; застосунок не зберігає їхньої копії"
      de: "Sicherungsdateien, die du exportierst (Settings → Data & account → Back up to file), sind nicht verschlüsselt und landen nur dort, wo du sie speicherst oder teilst; die App behält keine Kopie"
      fr: "Les fichiers de sauvegarde que vous exportez (Settings → Data & account → Back up to file) ne sont pas chiffrés et vont uniquement là où vous les enregistrez ou les partagez ; l’app n’en garde aucune copie"
      es: "Los archivos de copia de seguridad que exportas (Settings → Data & account → Back up to file) no están cifrados y van solo adonde los guardes o compartas; la app no guarda ninguna copia"

  # App-specific FAQ for the support page (generic purchase/data/ads answers
  # are added automatically from the flags above).
  faq:
    - q:
        en: Is this real trading? Can I win or lose real money?
        uk: Це справжня торгівля? Чи можу я виграти або втратити реальні гроші?
        de: Ist das echter Handel? Kann ich echtes Geld gewinnen oder verlieren?
        fr: "Est-ce du vrai trading ? Puis-je gagner ou perdre de l’argent réel ?"
        es: "¿Es trading real? ¿Puedo ganar o perder dinero real?"
      a:
        en: No. This is a simulation. All money in the app is virtual. The app never connects to an exchange account and never handles real funds. Nothing in it is financial advice. Virtual balances can't be paid out, bought or exchanged for anything.
        uk: Ні. Це симуляція. Усі гроші в застосунку віртуальні. Застосунок ніколи не під’єднується до облікового запису на біржі і ніколи не працює з реальними коштами. Ніщо в ньому не є фінансовою порадою. Віртуальні баланси не можна вивести, купити чи обміняти на щось.
        de: Nein. Dies ist eine Simulation. Alles Geld in der App ist virtuell. Die App verbindet sich nie mit einem Börsenkonto und verwaltet nie echtes Geld. Nichts darin ist eine Finanzberatung. Virtuelle Guthaben können weder ausgezahlt noch gekauft oder gegen etwas eingetauscht werden.
        fr: "Non. Ceci est une simulation. Tout l’argent dans l’app est virtuel. L’app ne se connecte jamais à un compte sur une plateforme d’échange et ne gère jamais de fonds réels. Rien dans l’app ne constitue un conseil financier. Les soldes virtuels ne peuvent être ni retirés, ni achetés, ni échangés contre quoi que ce soit."
        es: "No. Esto es una simulación. Todo el dinero de la app es virtual. La app nunca se conecta a una cuenta de un exchange y nunca maneja fondos reales. Nada en ella es asesoramiento financiero. Los saldos virtuales no se pueden retirar, comprar ni cambiar por nada."
    - q:
        en: Futures prices don't load in my country.
        uk: У моїй країні не завантажуються ціни ф’ючерсів.
        de: In meinem Land laden die Futures-Preise nicht.
        fr: "Les prix des contrats à terme ne se chargent pas dans mon pays."
        es: "En mi país no cargan los precios de futuros."
      a:
        en: Binance blocks its futures market data in some regions. The app then says "Futures data unavailable in your region". Spot prices still work there, so on the free plan you can create a spot portfolio instead. Prices need an internet connection; when you come back online, the app catches up on what happened to your orders while it was closed.
        uk: У деяких регіонах Binance блокує свої ф’ючерсні ринкові дані. Тоді застосунок показує «Futures data unavailable in your region». Спот-ціни там працюють, тож на безкоштовному плані ви можете натомість створити спот-портфель. Для цін потрібен інтернет; коли ви знову онлайн, застосунок наздоганяє те, що сталося з вашими ордерами, поки він був закритий.
        de: In manchen Regionen sperrt Binance seine Futures-Marktdaten. Die App zeigt dann „Futures data unavailable in your region“. Spot-Preise funktionieren dort weiterhin, daher kannst du im kostenlosen Plan stattdessen ein Spot-Portfolio anlegen. Preise brauchen eine Internetverbindung; bist du wieder online, holt die App nach, was mit deinen Orders passiert ist, während sie geschlossen war.
        fr: "Dans certaines régions, Binance bloque ses données de marché des contrats à terme. L’app affiche alors « Futures data unavailable in your region ». Les prix au comptant fonctionnent toujours, donc avec l’offre gratuite vous pouvez créer un portefeuille au comptant à la place. Les prix demandent une connexion ; une fois de retour en ligne, l’app rattrape ce qui est arrivé à vos ordres pendant qu’elle était fermée."
        es: "En algunas regiones Binance bloquea sus datos de mercado de futuros. La app muestra entonces «Futures data unavailable in your region». Los precios al contado siguen funcionando, así que con el plan gratuito puedes crear una cartera al contado en su lugar. Los precios necesitan conexión; cuando vuelves a estar en línea, la app pone al día lo que pasó con tus órdenes mientras estaba cerrada."
    - q:
        en: How do I delete my data?
        uk: Як видалити мої дані?
        de: Wie lösche ich meine Daten?
        fr: "Comment supprimer mes données ?"
        es: "¿Cómo borro mis datos?"
      a:
        en: There is no account and nothing is stored on a server, so all your data is on your phone. To delete one portfolio with its orders, trades and history, open Portfolio, tap the portfolio name and choose Delete portfolio (Reset and start over clears its history instead). Uninstalling the app deletes everything. Backup files you exported and your phone's own backups are yours to delete.
        uk: Облікового запису немає, і на сервері нічого не зберігається, тож усі ваші дані — на вашому телефоні. Щоб видалити один портфель з його ордерами, угодами та історією, відкрийте Portfolio, торкніться назви портфеля й виберіть Delete portfolio (Reset and start over натомість очищає його історію). Видалення застосунку видаляє все. Експортовані файли резервних копій і власні резервні копії телефона ви видаляєте самі.
        de: Es gibt kein Konto, und nichts wird auf einem Server gespeichert, daher liegen alle deine Daten auf deinem Telefon. Um ein Portfolio mit seinen Orders, Trades und seinem Verlauf zu löschen, öffne Portfolio, tippe auf den Portfolionamen und wähle Delete portfolio (Reset and start over leert stattdessen nur den Verlauf). Das Deinstallieren der App löscht alles. Exportierte Sicherungsdateien und die eigenen Sicherungen deines Telefons löschst du selbst.
        fr: "Il n’y a pas de compte et rien n’est stocké sur un serveur : toutes vos données sont sur votre téléphone. Pour supprimer un portefeuille avec ses ordres, transactions et historique, ouvrez Portfolio, touchez le nom du portefeuille et choisissez Delete portfolio (Reset and start over efface plutôt son historique). Désinstaller l’app supprime tout. Les fichiers de sauvegarde exportés et les sauvegardes du téléphone, c’est à vous de les supprimer."
        es: "No hay cuenta y no se guarda nada en un servidor, así que todos tus datos están en tu teléfono. Para borrar una cartera con sus órdenes, operaciones e historial, abre Portfolio, toca el nombre de la cartera y elige Delete portfolio (Reset and start over borra solo su historial). Desinstalar la app lo borra todo. Los archivos de copia de seguridad que exportaste y las copias del propio teléfono los borras tú."

fridge-widget:
