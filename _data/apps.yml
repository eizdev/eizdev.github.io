  tagline:
    en: A home-screen widget that looks like a fridge door with paper stickers and labels.
    uk: Віджет для головного екрана, схожий на дверцята холодильника з паперовими стікерами та етикетками.
    de: Ein Widget für den Startbildschirm, das wie eine Kühlschranktür mit Papier-Stickern und Etiketten aussieht.
    fr: "Un widget d’écran d’accueil qui ressemble à une porte de frigo avec des stickers en papier et des étiquettes."
    es: "Un widget para la pantalla de inicio que parece la puerta de una nevera con pegatinas de papel y etiquetas."
  email_tag: fridgewidget            # plus-alias tag, used only if studio.support.plus_aliases
  effective_date: 2026-11-10
  stores:
    ios: ""                          # Android only (app repo D1)
    android: ""                      # https://play.google.com/store/apps/details?id=com.eizdev.fridge once live

  # Facts: app repo eizdev/fridge-widget docs/legal/FACTS.md and docs/DECISIONS.md (2026-11-10).
  # Native Android app (D1, D7). No accounts (D3), no ads and no IAP in v1 (D4), no analytics.
  # Sync round S4 (2026-11-11): the app now holds the INTERNET and ACCESS_NETWORK_STATE permissions and the
  # Firebase Auth / Messaging / Remote Config SDKs (D-S9, superseding D2), but sends nothing until the user's first
  # Share or Join of a fridge, which no build offers yet. So "sends nothing over the internet" replaces "no internet
  # access", and sdks stays [] (no SDK processes personal data before then). S12 rewrites this entry (accounts,
  # server, sdks, data_location, effective_date) before sharing ships.
  # Sync round S5 (2026-11-11): the app has a Share entry (and debug-only invite/join entries), shown only in a build
  # with the owner's Firebase config, which no build has yet, so this entry still holds. A release with that config
  # must not ship before S12 updates it (app docs/OWNER_TODO.md).
  # Sync round S9 (2026-11-11): in such a build a successful Share or Join also turns on Firebase Cloud Messaging; the
  # FCM token goes to the Worker, and data messages carry only a fridge id (no notifications). Still no build has the
  # config, so this entry still holds; S12 adds the token (device id) when it rewrites the entry.
  # Android Auto Backup stays on (D11): data_location says so.
  # The app ships en and uk (D5). In-app paths (app T5.2): fridge list ⋮ → About (uk: ⋮ → Про застосунок);
  # a fridge is deleted with ⋮ next to it → Delete. de/fr/es users see the English app, so those texts use the
  # English labels. Android only: summary_note, backup_note, local_delete_note, processing_note and store_terms
  # replace the generic iOS + Android wording of the shared templates.
  ads: false
  iap: false
  accounts: false
  analytics: false

  # No "delete all my data" action in the app: one fridge is deleted from the app's list of fridges,
  # everything by uninstalling or clearing storage. Said by local_delete_note and the FAQ below.
  delete_data_path: ""

  summary_note:
    en: "If backup is on for your phone, Android can also keep a copy in your own Google backup (see below)."
    uk: "Якщо на телефоні ввімкнено резервне копіювання, Android також може зберігати копію у вашій власній резервній копії Google (див. нижче)."
    de: "Ist auf deinem Telefon die Sicherung aktiviert, kann Android außerdem eine Kopie in deiner eigenen Google-Sicherung ablegen (siehe unten)."
    fr: "Si la sauvegarde est activée sur votre téléphone, Android peut aussi en garder une copie dans votre propre sauvegarde Google (voir ci-dessous)."
    es: "Si la copia de seguridad está activada en tu teléfono, Android también puede guardar una copia en tu propia copia de seguridad de Google (ver más abajo)."
  # App D11 (Auto Backup on, database only) and D12 / M6 F2 (deleted text is overwritten and checkpointed).
  backup_note:
    en: "If backup is on for your phone, Android can include these data in your own Google device backup and restore them when you set up a new phone. Android makes that backup for your Google account; it is not sent to us and we cannot see it. Text you delete in the app is erased from the app's storage, so later backups no longer contain it."
    uk: "Якщо на телефоні ввімкнено резервне копіювання, Android може додати ці дані до вашої власної резервної копії пристрою в Google і відновити їх, коли ви налаштовуватимете новий телефон. Цю копію створює Android для вашого облікового запису Google; її не надсилають нам, і ми її не бачимо. Текст, який ви видаляєте в застосунку, стирається зі сховища застосунку, тож наступні резервні копії його вже не містять."
    de: "Ist auf deinem Telefon die Sicherung aktiviert, kann Android diese Daten in deine eigene Google-Gerätesicherung aufnehmen und sie wiederherstellen, wenn du ein neues Telefon einrichtest. Diese Sicherung erstellt Android für dein Google-Konto; sie wird nicht an uns gesendet, und wir können sie nicht sehen. Text, den du in der App löschst, wird aus dem Speicher der App entfernt, spätere Sicherungen enthalten ihn also nicht mehr."
    fr: "Si la sauvegarde est activée sur votre téléphone, Android peut inclure ces données dans votre propre sauvegarde Google de l’appareil et les restaurer quand vous configurez un nouveau téléphone. Android réalise cette sauvegarde pour votre compte Google ; elle ne nous est pas envoyée et nous ne pouvons pas la voir. Le texte que vous supprimez dans l’app est effacé du stockage de l’app : les sauvegardes suivantes ne le contiennent plus."
    es: "Si la copia de seguridad está activada en tu teléfono, Android puede incluir estos datos en tu propia copia de seguridad de Google del dispositivo y restaurarlos cuando configures un teléfono nuevo. Android hace esa copia para tu cuenta de Google; no se nos envía y no podemos verla. El texto que borras en la app se elimina del almacenamiento de la app, así que las copias posteriores ya no lo contienen."
  local_delete_note:
    en: "To delete a fridge with its stickers and labels, tap ⋮ next to it in the app's list of fridges, then **Delete**; its text is erased from your device. Uninstalling the app, or clearing its storage in your phone's Settings → Apps, erases everything."
    uk: "Щоб видалити холодильник разом зі стікерами й етикетками, торкніться ⋮ біля нього в списку холодильників у застосунку, а потім **Видалити**; його текст буде стерто з пристрою. Якщо видалити застосунок або очистити його сховище в Налаштуваннях телефона → Застосунки, буде стерто все."
    de: "Um einen Kühlschrank mit seinen Stickern und Etiketten zu löschen, tippe in der Liste der Kühlschränke in der App neben ihm auf ⋮ und dann auf **Delete**; sein Text wird von deinem Gerät gelöscht. Wenn du die App deinstallierst oder ihren Speicher in den Einstellungen deines Telefons → Apps löschst, wird alles gelöscht."
    fr: "Pour supprimer un frigo avec ses stickers et étiquettes, touchez ⋮ à côté de lui dans la liste des frigos de l’app, puis **Delete** ; son texte est effacé de votre appareil. Désinstaller l’app, ou vider son stockage dans les Paramètres du téléphone → Applications, efface tout."
    es: "Para borrar una nevera con sus pegatinas y etiquetas, toca ⋮ junto a ella en la lista de neveras de la app y luego **Delete**; su texto se borra de tu dispositivo. Desinstalar la app, o borrar su almacenamiento en Ajustes del teléfono → Aplicaciones, lo borra todo."
  processing_note:
    en: "The app sends nothing over the internet, so its data stays on your device and, if backup is on, in your own Google device backup, which Android keeps for your Google account."
    uk: "Застосунок нічого не надсилає через інтернет, тож його дані залишаються на вашому пристрої та, якщо ввімкнено резервне копіювання, у вашій власній резервній копії пристрою в Google, яку Android зберігає для вашого облікового запису Google."
    de: "Die App sendet nichts über das Internet, ihre Daten bleiben also auf deinem Gerät und, wenn die Sicherung aktiviert ist, in deiner eigenen Google-Gerätesicherung, die Android für dein Google-Konto speichert."
    fr: "L’app n’envoie rien sur Internet : ses données restent sur votre appareil et, si la sauvegarde est activée, dans votre propre sauvegarde Google de l’appareil, qu’Android conserve pour votre compte Google."
    es: "La app no envía nada por internet, así que sus datos se quedan en tu dispositivo y, si la copia de seguridad está activada, en tu propia copia de seguridad de Google del dispositivo, que Android guarda para tu cuenta de Google."
  store_terms:                       # Android only (app D1)
    en: Google Play Terms of Service
    uk: Умови використання Google Play
    de: Google Play-Nutzungsbedingungen
    fr: "Conditions d’utilisation de Google Play"
    es: "Términos del Servicio de Google Play"

  data_location:
    en: Only on your phone, in the app's own storage. The app sends nothing over the internet and we have no server. If backup is on for your phone, Android can include the app's data in your own Google device backup and restore it when you set up a new phone; that backup belongs to your Google account and we cannot see it.
    uk: Лише на вашому телефоні, у власному сховищі застосунку. Застосунок нічого не надсилає через інтернет, а власного сервера в нас немає. Якщо на телефоні ввімкнено резервне копіювання, Android може додати дані застосунку до вашої власної резервної копії пристрою в Google і відновити їх, коли ви налаштовуватимете новий телефон; ця копія належить вашому обліковому запису Google, і ми її не бачимо.
    de: Nur auf deinem Telefon, im eigenen Speicher der App. Die App sendet nichts über das Internet, und wir haben keinen Server. Ist auf deinem Telefon die Sicherung aktiviert, kann Android die Daten der App in deine eigene Google-Gerätesicherung aufnehmen und sie wiederherstellen, wenn du ein neues Telefon einrichtest; diese Sicherung gehört zu deinem Google-Konto, und wir können sie nicht sehen.
    fr: "Uniquement sur votre téléphone, dans le stockage propre de l’app. L’app n’envoie rien sur Internet et nous n’avons pas de serveur. Si la sauvegarde est activée sur votre téléphone, Android peut inclure les données de l’app dans votre propre sauvegarde Google de l’appareil et les restaurer quand vous configurez un nouveau téléphone ; cette sauvegarde appartient à votre compte Google et nous ne pouvons pas la voir."
    es: "Solo en tu teléfono, en el almacenamiento propio de la app. La app no envía nada por internet y no tenemos servidor. Si la copia de seguridad está activada en tu teléfono, Android puede incluir los datos de la app en tu propia copia de seguridad de Google del dispositivo y restaurarlos cuando configures un teléfono nuevo; esa copia pertenece a tu cuenta de Google y no podemos verla."

  warranty_note:
    en: "The widget is shown by your phone's home-screen app (the launcher): how often it refreshes, which sizes it allows and how it looks can differ between phones and launchers, and we do not control them. Your fridges are stored on your device (and in your own Google device backup if backup is on); we cannot recover them if they are lost."
    uk: "Віджет показує застосунок головного екрана вашого телефона (лаунчер): як часто віджет оновлюється, які розміри дозволені і який він має вигляд, може відрізнятися залежно від телефона й лаунчера, і ми цього не контролюємо. Ваші холодильники зберігаються на вашому пристрої (і у вашій власній резервній копії пристрою в Google, якщо її ввімкнено); ми не можемо відновити їх у разі втрати."
    de: "Das Widget wird von der Startbildschirm-App deines Telefons (dem Launcher) angezeigt: Wie oft es sich aktualisiert, welche Größen möglich sind und wie es aussieht, kann je nach Telefon und Launcher verschieden sein, und darauf haben wir keinen Einfluss. Deine Kühlschränke liegen auf deinem Gerät (und in deiner eigenen Google-Gerätesicherung, wenn die Sicherung aktiviert ist); gehen sie verloren, können wir sie nicht wiederherstellen."
    fr: "Le widget est affiché par l’application d’écran d’accueil de votre téléphone (le launcher) : sa fréquence de mise à jour, les tailles possibles et son apparence peuvent varier selon le téléphone et le launcher, et nous ne les contrôlons pas. Vos frigos sont stockés sur votre appareil (et dans votre propre sauvegarde Google de l’appareil si la sauvegarde est activée) ; nous ne pouvons pas les récupérer en cas de perte."
    es: "El widget lo muestra la app de pantalla de inicio de tu teléfono (el launcher): la frecuencia con la que se actualiza, los tamaños posibles y su aspecto pueden variar según el teléfono y el launcher, y no los controlamos. Tus neveras se guardan en tu dispositivo (y en tu propia copia de seguridad de Google del dispositivo si la copia está activada); no podemos recuperarlas si se pierden."

  sdks: []                           # no third-party SDKs that process personal data (FACTS.md)

  # Data the app stores locally (never sent to us): the three Room tables in FACTS.md.
