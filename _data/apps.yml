      de: Deine Kühlschränke (ihr Stil, der optionale Name, den du ihnen gibst, und ob die Uhr angezeigt wird)
      fr: "Vos frigos (leur style, le nom facultatif que vous leur donnez et si l’horloge est affichée)"
