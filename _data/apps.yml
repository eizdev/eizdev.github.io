      fr: "Quel frigo affiche chaque widget de l’écran d’accueil, et la dernière taille du widget"
      es: "Qué nevera muestra cada widget de la pantalla de inicio y el último tamaño del widget"

  # App-specific FAQ for the support page ("Where is my data stored?" comes from data_location).
  faq:
    - q:
        en: The widget is blank or doesn't update.
        uk: Віджет порожній або не оновлюється.
        de: Das Widget ist leer oder aktualisiert sich nicht.
        fr: "Le widget est vide ou ne se met pas à jour."
        es: "El widget está en blanco o no se actualiza."
      a:
        en: Open the app once, then look at the widget again. If it is still blank, remove the widget from the home screen and add it again, picking your existing fridge; your stickers are kept. Some launchers limit how often widgets are updated, so there the widget can take a moment to catch up.
        uk: Відкрийте застосунок один раз і знову подивіться на віджет. Якщо він досі порожній, приберіть віджет із головного екрана й додайте його знову, вибравши свій наявний холодильник; ваші стікери збережуться. Деякі лаунчери обмежують, як часто оновлюються віджети, тож там віджету може знадобитися трохи часу, щоб оновитися.
        de: Öffne die App einmal und sieh dir das Widget dann noch einmal an. Ist es weiterhin leer, entferne das Widget vom Startbildschirm und füge es erneut hinzu, wobei du deinen vorhandenen Kühlschrank auswählst; deine Sticker bleiben erhalten. Manche Launcher begrenzen, wie oft Widgets aktualisiert werden, daher kann das Widget dort einen Moment brauchen.
        fr: "Ouvrez l’app une fois, puis regardez à nouveau le widget. S’il est toujours vide, retirez le widget de l’écran d’accueil et ajoutez-le à nouveau en choisissant votre frigo existant ; vos stickers sont conservés. Certains launchers limitent la fréquence de mise à jour des widgets, donc le widget peut y mettre un moment à se mettre à jour."
        es: "Abre la app una vez y vuelve a mirar el widget. Si sigue en blanco, quita el widget de la pantalla de inicio y vuelve a añadirlo eligiendo tu nevera existente; tus pegatinas se conservan. Algunos launchers limitan la frecuencia con la que se actualizan los widgets, así que allí el widget puede tardar un momento en ponerse al día."
    - q:
        en: I removed the widget. Are my stickers gone? Can I move a fridge to another widget?
        uk: Віджет прибрано. Мої стікери зникли? Чи можна перенести холодильник на інший віджет?
        de: Ich habe das Widget entfernt. Sind meine Sticker weg? Kann ich einen Kühlschrank auf ein anderes Widget bringen?
        fr: "J’ai retiré le widget. Mes stickers ont-ils disparu ? Puis-je déplacer un frigo vers un autre widget ?"
        es: "He quitado el widget. ¿Se han perdido mis pegatinas? ¿Puedo pasar una nevera a otro widget?"
      a:
        en: No, they are not gone. Removing a widget doesn't delete its fridge; every fridge stays in the app's list of fridges. To show it again, or on another widget, add a new widget to the home screen and pick the existing fridge when the app asks. One fridge can also be shown on several widgets.
        uk: Ні, не зникли. Якщо прибрати віджет, його холодильник не видаляється; кожен холодильник лишається в списку холодильників у застосунку. Щоб знову показати його або показати на іншому віджеті, додайте новий віджет на головний екран і виберіть наявний холодильник, коли застосунок запитає. Один холодильник також можна показувати на кількох віджетах.
        de: Nein, sie sind nicht weg. Wenn du ein Widget entfernst, wird sein Kühlschrank nicht gelöscht; jeder Kühlschrank bleibt in der Liste der Kühlschränke in der App. Um ihn wieder oder auf einem anderen Widget zu zeigen, füge ein neues Widget zum Startbildschirm hinzu und wähle den vorhandenen Kühlschrank, wenn die App fragt. Ein Kühlschrank kann auch auf mehreren Widgets erscheinen.
        fr: "Non, ils n’ont pas disparu. Retirer un widget ne supprime pas son frigo ; chaque frigo reste dans la liste des frigos de l’app. Pour l’afficher à nouveau, ou sur un autre widget, ajoutez un nouveau widget à l’écran d’accueil et choisissez le frigo existant quand l’app le demande. Un même frigo peut aussi s’afficher sur plusieurs widgets."
        es: "No, no se han perdido. Quitar un widget no borra su nevera; cada nevera sigue en la lista de neveras de la app. Para mostrarla de nuevo, o en otro widget, añade un widget nuevo a la pantalla de inicio y elige la nevera existente cuando la app lo pregunte. Una misma nevera también puede mostrarse en varios widgets."
    - q:
        en: Can I sync my fridges with another phone?
        uk: Чи можна синхронізувати холодильники з іншим телефоном?
        de: Kann ich meine Kühlschränke mit einem anderen Telefon synchronisieren?
        fr: "Puis-je synchroniser mes frigos avec un autre téléphone ?"
        es: "¿Puedo sincronizar mis neveras con otro teléfono?"
      a:
        en: Not in this version. There are no accounts and the app sends nothing over the internet, so your fridges stay on the phone where you made them. If backup is on for your phone, Android can bring them over when you set up a new phone from that backup.
        uk: У цій версії — ні. Облікових записів немає, і застосунок нічого не надсилає через інтернет, тож ваші холодильники лишаються на телефоні, де ви їх створили. Якщо на телефоні ввімкнено резервне копіювання, Android може перенести їх, коли ви налаштовуватимете новий телефон із цієї копії.
        de: In dieser Version nicht. Es gibt keine Konten, und die App sendet nichts über das Internet, daher bleiben deine Kühlschränke auf dem Telefon, auf dem du sie angelegt hast. Ist auf deinem Telefon die Sicherung aktiviert, kann Android sie übernehmen, wenn du ein neues Telefon aus dieser Sicherung einrichtest.
        fr: "Pas dans cette version. Il n’y a pas de compte et l’app n’envoie rien sur Internet, donc vos frigos restent sur le téléphone où vous les avez créés. Si la sauvegarde est activée sur votre téléphone, Android peut les transférer quand vous configurez un nouveau téléphone à partir de cette sauvegarde."
        es: "En esta versión no. No hay cuentas y la app no envía nada por internet, así que tus neveras se quedan en el teléfono donde las creaste. Si la copia de seguridad está activada en tu teléfono, Android puede traerlas cuando configures un teléfono nuevo a partir de esa copia."
    - q:
        en: How do I delete my data?
        uk: Як видалити мої дані?
        de: Wie lösche ich meine Daten?
        fr: "Comment supprimer mes données ?"
        es: "¿Cómo borro mis datos?"
      a:
        en: There is no account and nothing is stored on a server, so all your data is on your phone. To remove a fridge with its stickers and labels, tap ⋮ next to it in the app's list of fridges, then **Delete**; removing a widget only takes it off the home screen. To erase everything the app has stored, uninstall the app or clear its storage in your phone's Settings → Apps. Copies in your phone's own Google backup are managed in your Google account.
        uk: Облікового запису немає, і на сервері нічого не зберігається, тож усі ваші дані — на вашому телефоні. Щоб прибрати холодильник з його стікерами й етикетками, торкніться ⋮ біля нього в списку холодильників у застосунку, а потім **Видалити**; якщо прибрати віджет, він лише зникне з головного екрана. Щоб стерти все, що зберігає застосунок, видаліть застосунок або очистьте його сховище в Налаштуваннях телефона → Застосунки. Копіями у власній резервній копії телефона в Google ви керуєте у своєму обліковому записі Google.
        de: Es gibt kein Konto, und nichts wird auf einem Server gespeichert, daher liegen alle deine Daten auf deinem Telefon. Um einen Kühlschrank mit seinen Stickern und Etiketten zu entfernen, tippe in der Liste der Kühlschränke in der App neben ihm auf ⋮ und dann auf **Delete**; ein Widget zu entfernen nimmt es nur vom Startbildschirm. Um alles zu löschen, was die App gespeichert hat, deinstalliere die App oder lösche ihren Speicher in den Einstellungen deines Telefons → Apps. Kopien in der eigenen Google-Sicherung deines Telefons verwaltest du in deinem Google-Konto.
        fr: "Il n’y a pas de compte et rien n’est stocké sur un serveur : toutes vos données sont sur votre téléphone. Pour retirer un frigo avec ses stickers et étiquettes, touchez ⋮ à côté de lui dans la liste des frigos de l’app, puis **Delete** ; retirer un widget ne fait que l’enlever de l’écran d’accueil. Pour effacer tout ce que l’app a enregistré, désinstallez l’app ou videz son stockage dans les Paramètres du téléphone → Applications. Les copies dans la sauvegarde Google de votre téléphone se gèrent dans votre compte Google."
        es: "No hay cuenta y no se guarda nada en un servidor, así que todos tus datos están en tu teléfono. Para quitar una nevera con sus pegatinas y etiquetas, toca ⋮ junto a ella en la lista de neveras de la app y luego **Delete**; quitar un widget solo lo saca de la pantalla de inicio. Para borrar todo lo que la app ha guardado, desinstala la app o borra su almacenamiento en Ajustes del teléfono → Aplicaciones. Las copias en la copia de seguridad de Google de tu teléfono se gestionan en tu cuenta de Google."
    - q:
        en: Where do I find the privacy policy, terms and support in the app?
        uk: Де в застосунку знайти політику конфіденційності, умови та підтримку?
        de: Wo finde ich in der App die Datenschutzerklärung, die Nutzungsbedingungen und den Support?
        fr: "Où trouver la politique de confidentialité, les conditions et le support dans l’app ?"
        es: "¿Dónde encuentro en la app la política de privacidad, los términos y el soporte?"
      a:
        en: "In the app's list of fridges, tap ⋮ at the top right, then **About**. From there you can also email us (the app version is already in the subject) and see the open-source licenses."
        uk: "У списку холодильників у застосунку торкніться ⋮ угорі праворуч, а потім **Про застосунок**. Звідти також можна написати нам (версія застосунку вже буде в темі листа) і переглянути ліцензії відкритого коду."
        de: "Tippe in der Liste der Kühlschränke in der App oben rechts auf ⋮ und dann auf **About**. Dort kannst du uns auch eine E-Mail schreiben (die App-Version steht schon im Betreff) und die Open-Source-Lizenzen ansehen."
        fr: "Dans la liste des frigos de l’app, touchez ⋮ en haut à droite, puis **About**. Vous pouvez aussi nous écrire depuis cet écran (la version de l’app est déjà dans l’objet) et consulter les licences open source."
        es: "En la lista de neveras de la app, toca ⋮ arriba a la derecha y luego **About**. Desde ahí también puedes escribirnos (la versión de la app ya va en el asunto) y ver las licencias de código abierto."
